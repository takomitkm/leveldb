name: e26-mysql-interleaved

# E26f-2: MySQL cost, ONE runner, three variants interleaved.
# The matrix rig (e26-mysql-via-leveldb.yml) put each variant on its own VM;
# two green runs gave base 12.8/5.8 s and dironly 6.9/13.0 s - cross-VM disk
# variance swamps the patch delta (dirroot-dironly flipped sign).  Here all
# three builds share one runner and the benches are interleaved round-robin,
# so the comparison is same-disk.
#
#   base    = mysql/mysql-server trunk 06bcb0eb
#   dironly = takomitkm/mysql-server 0c860398 (PR #895 commits 1-2)
#   dirroot = takomitkm/mysql-server 9eb979ae (PR #895 head, + volume root)
#
# Workload per round: 200 x (CREATE TABLE + 50 INSERTs + DROP TABLE), InnoDB
# file-per-table, driven through the mysql client with cmd redirection.

on:
  push:
    branches: [bench-e26]
  workflow_dispatch:

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - name: checkout the three trees
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/mysql/mysql-server base
          git clone --depth 1 https://github.com/takomitkm/mysql-server dironly
          git clone --depth 1 https://github.com/takomitkm/mysql-server dirroot
          Set-Location base
          git fetch --depth 1 origin 06bcb0eb0ad281e08dd2b4d81b99ad25491433e7
          git checkout 06bcb0eb0ad281e08dd2b4d81b99ad25491433e7
          Set-Location ..\dironly
          git fetch --depth 1 origin 0c860398a8e26526597d3466d27981d19e6b1fae
          git checkout 0c860398a8e26526597d3466d27981d19e6b1fae
          Set-Location ..\dirroot
          git fetch --depth 1 origin 9eb979ae49a94df805e759931c2667061134291a
          git checkout 9eb979ae49a94df805e759931c2667061134291a
          Set-Location ..

      - name: bison (from the upstream release zip)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/lexxmark/winflexbison/releases/download/v2.5.25/win_flex_bison-2.5.25.zip' -OutFile D:\wfb.zip
          Expand-Archive D:\wfb.zip -DestinationPath C:\WinFlexBison -Force
          $b = 'C:\WinFlexBison\win_bison.exe'
          if (-not (Test-Path $b)) { Write-Host 'no bison found'; exit 1 }
          & $b --version
          if ($LASTEXITCODE -ne 0) { Write-Host 'bison --version failed'; exit 1 }
          "BISON_PATH=$b" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: deps once (static for the server, dynamic only for ssl DLLs)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md zlib:x64-windows-static-md curl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: stage openssl once (custom layout + applink in the vcpkg tree)
        shell: pwsh
        run: |
          $vp = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          $stage = "D:\openssl-stage"
          New-Item -ItemType Directory -Force -Path "$stage\include","$stage\lib","$stage\bin" | Out-Null
          Copy-Item "$vp\include\openssl" "$stage\include\openssl" -Recurse -Force
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/openssl/openssl/master/ms/applink.c' -OutFile "$stage\include\openssl\applink.c"
          Copy-Item "$stage\include\openssl\applink.c" "$vp\include\openssl\applink.c" -Force
          Copy-Item "$vp\lib\libssl.lib","$vp\lib\libcrypto.lib" "$stage\lib\" -Force
          $vpd = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          Copy-Item "$vpd\libcrypto-3-x64.dll","$vpd\libssl-3-x64.dll" "$stage\bin\" -Force
          $tool = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\openssl\openssl.exe"
          Copy-Item $tool "$stage\bin\" -ErrorAction SilentlyContinue
          "OPENSSL_STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: build all three servers (sequential, one runner)
        shell: pwsh
        run: |
          foreach ($v in 'base','dironly','dirroot') {
            Write-Host "=== configure $v"
            Push-Location $v
            cmake -S . -B build -A x64 `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
              -DWITH_SSL="$env:OPENSSL_STAGE" -DWITH_ZLIB=system -DWITH_CURL=system `
              -DWITH_UNIT_TESTS=0 -DDOWNLOAD_BOOST=1 -DWITH_BOOST="D:\boost" `
              -DINSTALL_LAYOUT=STANDALONE -DBISON_EXECUTABLE="$env:BISON_PATH"
            $rc = $LASTEXITCODE
            if ($rc -eq 0) {
              Write-Host "=== build $v"
              cmake --build build --config Release --target mysqld mysql -- /m
              $rc = $LASTEXITCODE
            }
            Pop-Location
            if ($rc -ne 0) { Write-Host "FAILED: $v"; exit $rc }
            Write-Host "=== $v built"
          }

      - name: prepare runtimes (copy build-tree DLLs next to each mysqld)
        shell: pwsh
        run: |
          foreach ($v in 'base','dironly','dirroot') {
            $bin = "$v\build\runtime_output_directory\Release"
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin\*.dll" $bin -Force
            $binFull = (Resolve-Path $bin).Path
            Get-ChildItem "$v\build" -Recurse -Filter '*.dll' -ErrorAction SilentlyContinue | ForEach-Object {
              if ($_.DirectoryName -eq $binFull) { return }  # already in place
              Copy-Item $_.FullName -Destination $bin -Force
            }
            New-Item -ItemType Directory -Force -Path "D:\e26my\$v\data","D:\e26my\$v\tmp" | Out-Null
            Write-Host "$v dlls: $((Get-ChildItem $bin -Filter '*.dll' | Select-Object -ExpandProperty Name) -join ', ')"
          }

      - name: start three servers on ports 13306/13307/13308
        shell: pwsh
        run: |
          $ports = @{ base = 13306; dironly = 13307; dirroot = 13308 }
          foreach ($v in 'base','dironly','dirroot') {
            $bin = (Resolve-Path "$v\build\runtime_output_directory\Release").Path
            & "$bin\mysqld.exe" --no-defaults --initialize-insecure "--datadir=D:\e26my\$v\data" "--tmpdir=D:\e26my\$v\tmp"
            if ($LASTEXITCODE -ne 0) { Write-Host "init failed: $v"; exit 1 }
            $p = Start-Process "$bin\mysqld.exe" -PassThru -ArgumentList @(
              '--no-defaults', "--datadir=D:\e26my\$v\data", "--tmpdir=D:\e26my\$v\tmp",
              "--port=$($ports[$v])", '--bind-address=127.0.0.1', '--console')
            Start-Sleep -Seconds 15
            if ($p.HasExited) { Write-Host "server exited: $v"; exit 1 }
            & "$bin\mysql.exe" --host=127.0.0.1 "--port=$($ports[$v])" --user=root -e "CREATE DATABASE e26"
            if ($LASTEXITCODE -ne 0) { Write-Host "create db failed: $v"; exit 1 }
            Write-Host "$v up on $($ports[$v])"
          }

      - name: bench - 3 interleaved rounds x 3 variants (same disk)
        shell: pwsh
        run: |
          $ports = @{ base = 13306; dironly = 13307; dirroot = 13308 }
          $sql = 'D:\e26.sql'
          $w = [IO.StreamWriter]::new($sql)
          foreach ($i in 1..200) {
            $w.WriteLine("CREATE TABLE e26.t_$i (id INT PRIMARY KEY AUTO_INCREMENT, v CHAR(200)) ENGINE=InnoDB;")
            foreach ($r in 1..50) {
              $w.WriteLine("INSERT INTO e26.t_$i (v) VALUES ('{0}');" -f ('x' * 180))
            }
            $w.WriteLine("DROP TABLE e26.t_$i;")
          }
          $w.Close()
          foreach ($round in 1..3) {
            foreach ($v in 'base','dironly','dirroot') {
              $bin = (Resolve-Path "$v\build\runtime_output_directory\Release").Path
              $sw = [Diagnostics.Stopwatch]::StartNew()
              cmd /c "`"$bin\mysql.exe`" --host=127.0.0.1 --port=$($ports[$v]) --user=root < D:\e26.sql"
              $rc = $LASTEXITCODE
              $sw.Stop()
              if ($rc -ne 0) { Write-Host "bench failed: $v round $round (exit $rc)"; exit $rc }
              Write-Host ("ROUND{0} {1}: {2:N1} s for 200 rounds" -f $round, $v, $sw.Elapsed.TotalSeconds)
            }
          }

      - name: stop the servers
        if: always()
        shell: pwsh
        run: Get-Process mysqld -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue