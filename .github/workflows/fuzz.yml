#
# Runs the standalone fuzz harnesses from fuzz/ (opt-in build) on the two
# primary platforms. Upstream's build.yml covers the unit-test matrix; this
# workflow adds coverage for the public-API and recovery-path fuzzers.

name: fuzz
on: [push, pull_request]

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          -DLEVELDB_BUILD_TESTS=OFF -DLEVELDB_BUILD_BENCHMARKS=OFF
          -DLEVELDB_BUILD_FUZZ_TESTS=ON
      - name: Build
        run: cmake --build build --target leveldb_fuzz_db leveldb_fuzz_recovery
      # Seed = run_number: every push explores new inputs instead of replaying
      # the same fixed seed; the seed is printed in the harness output (and in
      # fuzz_*.log artifacts) so any failure stays reproducible.
      - name: Public-API fuzz
        shell: bash
        run: |
          set -o pipefail
          build/leveldb_fuzz_db${{ runner.os == 'Windows' && '.exe' || '' }} 150 ${{ github.run_number }} 2>&1 | tee fuzz_db.log
      - name: Recovery fuzz
        shell: bash
        run: |
          set -o pipefail
          build/leveldb_fuzz_recovery${{ runner.os == 'Windows' && '.exe' || '' }} 50 ${{ github.run_number }} 2>&1 | tee fuzz_recovery.log
      - name: Upload fuzz logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-logs-${{ matrix.os }}
          path: fuzz_*.log
