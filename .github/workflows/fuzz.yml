#
# Runs the standalone fuzz harnesses from fuzz/ (opt-in build) on the two
# primary platforms. Upstream's build.yml covers the unit-test matrix; this
# workflow adds coverage for the public-API and recovery-path fuzzers.

name: fuzz
on: [push, pull_request]

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          -DLEVELDB_BUILD_TESTS=OFF -DLEVELDB_BUILD_BENCHMARKS=OFF
          -DLEVELDB_BUILD_FUZZ_TESTS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build
        run: cmake --build build --target leveldb_fuzz_db leveldb_fuzz_recovery
      - name: Public-API fuzz
        run: build/leveldb_fuzz_db${{ runner.os == 'Windows' && '.exe' || '' }} 150 1
      - name: Recovery fuzz
        run: build/leveldb_fuzz_recovery${{ runner.os == 'Windows' && '.exe' || '' }} 50 1
