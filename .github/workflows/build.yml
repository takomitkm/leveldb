name: ci
on:
  push:
    # Docs-only commits don't exercise the tests; skip them.
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'LICENSE'
      - 'AUTHORS'
  pull_request:

permissions:
  contents: read

jobs:
  # L0 quick layer: one fast cell (ubuntu/gcc/Debug, fast gtest suites only)
  # runs before the full matrix, so most breakage is caught in ~2 minutes
  # instead of after a full matrix round-trip.
  quick:
    name: quick (ubuntu gcc Debug, fast suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Generate build config
      run: >-
        cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build"
        -DCMAKE_BUILD_TYPE=Debug
        -DLEVELDB_BUILD_TESTS=ON
        -DLEVELDB_BUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build "${{ github.workspace }}/build" --config Debug --parallel

    - name: Run fast test suites
      working-directory: ${{ github.workspace }}/build
      run: >-
        ./leveldb_tests
        --gtest_filter='ArenaTest.*:BloomTest.*:CRC.*:CacheTest.*:Coding.*:FileNameTest.*:FormatTest.*:HASH.*:Logging.*:SkipTest.*:VersionEditTest.*:WriteBatchTest.*'

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: quick-test-logs
        path: build/Testing/

  # Covers the opt-in profile: the library is compiled with
  # -DLEVELDB_DISABLE_EXCEPTIONS=ON (MSVC: /EHs-c- + _HAS_EXCEPTIONS=0,
  # gcc/clang: -fno-exceptions) while the tests still build with exceptions
  # enabled, i.e. the "library without exceptions, consumer with them"
  # combination the option is meant to support. Two cells only: the flag is
  # the same code path on every OS, so ubuntu/gcc plus windows/msvc is enough
  # to keep it from rotting.
  no-exceptions:
    needs: quick
    name: no-exceptions (${{ matrix.os }} ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          compiler: gcc
          CC: gcc
          CXX: g++
        - os: windows-2025
          compiler: msvc
          CC:
          CXX:
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install dependencies on Linux
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt-get update
        sudo apt-get install libkyotocabinet-dev libsnappy-dev libsqlite3-dev

    - name: Generate build config
      run: >-
        cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build"
        -DCMAKE_BUILD_TYPE=Debug
        -DLEVELDB_DISABLE_EXCEPTIONS=ON

    - name: Build
      run: cmake --build "${{ github.workspace }}/build" --config Debug --parallel

    # Guards the kyoto probe against silently skipping the target again: with
    # -fno-exceptions in CMAKE_CXX_FLAGS this check used to fail for the wrong
    # reason and db_bench_tree_db simply disappeared from the build.
    - name: Check the Kyoto Cabinet benchmark was generated
      if: ${{ runner.os == 'Linux' }}
      working-directory: ${{ github.workspace }}/build
      run: test -f db_bench_tree_db

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: ctest -C Debug --verbose

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: no-exceptions-logs-${{ matrix.os }}
        path: build/Testing/

  build-and-test:
    needs: quick
    name:  >-
      CI
      ${{ matrix.os }}
      ${{ matrix.compiler }}
      ${{ matrix.optimized && 'release' || 'debug' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc, msvc]
        # Pinned to the images -latest resolves to today: -latest is a
        # rolling alias (ubuntu is mid-migration to 26) and red must be
        # attributable to our commits, not to a swapped environment.
        os: [ubuntu-24.04, macos-26, windows-2025]
        optimized: [true, false]
        exclude:
        # MSVC only works on Windows.
        - os: ubuntu-24.04
          compiler: msvc
        - os: macos-26
          compiler: msvc
        # Not testing with GCC on macOS.
        - os: macos-26
          compiler: gcc
        # Only testing with MSVC on Windows.
        - os: windows-2025
          compiler: clang
        - os: windows-2025
          compiler: gcc
        include:
        - compiler: clang
          CC: clang
          CXX: clang++
        - compiler: gcc
          CC: gcc
          CXX: g++
        - compiler: msvc
          CC:
          CXX:

    env:
      CMAKE_BUILD_DIR: ${{ github.workspace }}/build
      CMAKE_BUILD_TYPE: ${{ matrix.optimized && 'RelWithDebInfo' || 'Debug' }}
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
      BINARY_SUFFIX: ${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
      BINARY_PATH: >-
        ${{ format(
        startsWith(matrix.os, 'windows') && '{0}\build\{1}\' || '{0}/build/',
        github.workspace,
        matrix.optimized && 'RelWithDebInfo' || 'Debug') }}

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install dependencies on Linux
      if: ${{ runner.os == 'Linux' }}
      # libgoogle-perftools-dev is temporarily removed from the package list
      # because it is currently broken on GitHub's Ubuntu 22.04.
      run: |
        sudo apt-get update
        sudo apt-get install libkyotocabinet-dev libsnappy-dev libsqlite3-dev

    - name: Generate build config
      run: >-
        cmake -S "${{ github.workspace }}" -B "${{ env.CMAKE_BUILD_DIR }}"
        -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
        -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/install_test/

    - name: Build
      run: >-
        cmake --build "${{ env.CMAKE_BUILD_DIR }}"
        --config "${{ env.CMAKE_BUILD_TYPE }}"

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: ctest -C "${{ env.CMAKE_BUILD_TYPE }}" --verbose

    - name: Run LevelDB Benchmarks
      run: ${{ env.BINARY_PATH }}db_bench${{ env.BINARY_SUFFIX }}

    - name: Run SQLite Benchmarks
      if: ${{ runner.os != 'Windows' }}
      run: ${{ env.BINARY_PATH }}db_bench_sqlite3${{ env.BINARY_SUFFIX }}

    - name: Run Kyoto Cabinet Benchmarks
      if: ${{ runner.os == 'Linux' && matrix.compiler == 'clang' }}
      run: ${{ env.BINARY_PATH }}db_bench_tree_db${{ env.BINARY_SUFFIX }}

    - name: Test CMake installation
      run: cmake --build "${{ env.CMAKE_BUILD_DIR }}" --target install

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ctest-logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.optimized && 'rel' || 'dbg' }}
        path: build/Testing/
