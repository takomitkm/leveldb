name: ci
on:
  push:
    # Docs-only commits don't exercise the tests; skip them.
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'LICENSE'
      - 'AUTHORS'
  pull_request:
    # Docs-only PRs don't exercise this workflow either. Note: if a check
    # from this workflow is ever made a required status check, a docs-only
    # PR would wait forever for a check that never starts - drop this
    # filter in that case (GitHub docs: "Handling skipped but required
    # checks").
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'LICENSE'
      - 'AUTHORS'

permissions:
  contents: read

jobs:
  # L0 quick layer: one fast cell (ubuntu/gcc/Debug, fast gtest suites only)
  # runs before the full matrix, so most breakage is caught in ~2 minutes
  # instead of after a full matrix round-trip.
  quick:
    name: quick (ubuntu gcc Debug, fast suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Generate build config
      run: >-
        cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build"
        -DCMAKE_BUILD_TYPE=Debug
        -DLEVELDB_BUILD_TESTS=ON
        -DLEVELDB_BUILD_BENCHMARKS=OFF

    - name: Build
      run: cmake --build "${{ github.workspace }}/build" --config Debug --parallel

    - name: Run fast test suites
      working-directory: ${{ github.workspace }}/build
      run: >-
        ./leveldb_tests
        --gtest_filter='ArenaTest.*:BloomTest.*:CRC.*:CacheTest.*:Coding.*:FileNameTest.*:FormatTest.*:HASH.*:Logging.*:SkipTest.*:VersionEditTest.*:WriteBatchTest.*'

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: quick-test-logs
        path: build/Testing/

  # L0-W quick layer, Windows half. The four Windows-only regressions in
  # util/env_windows_test.cc (RenameFile replacing CURRENT, MANIFEST
  # parent-directory sync, LOG append across opens, open-on-read) used to be
  # reachable only through build-and-test, i.e. after a full matrix
  # round-trip (~15 minutes). They are cheap: one small test binary plus two
  # suites inside leveldb_tests. This cell runs exactly those and nothing
  # else, so the same breakage surfaces in ~3 minutes.
  #
  # Deliberately parallel to `quick` (no needs:) so a Windows-only breakage
  # never blocks the Linux/macOS quick signal or the full matrix. The
  # workflow run still goes red because a failed job fails the run; the
  # trade-off is written up in the design note that ships with this change.
  win-quick:
    name: win-quick (windows msvc Debug, Windows env suites)
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    # Same generator and configuration as the windows/msvc/debug cell of
    # build-and-test (default Visual Studio generator, Debug). Benchmarks are
    # switched off because this cell never runs them: they are separate
    # targets and cannot change how the library or the tests compile.
    - name: Generate build config
      shell: bash
      run: >-
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=Debug
        -DLEVELDB_BUILD_TESTS=ON
        -DLEVELDB_BUILD_BENCHMARKS=OFF
        -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

    # Building the two targets by name keeps the step short and guards the
    # layout as well: if env_windows_test stops being generated on Windows
    # (e.g. the WIN32 branch in CMakeLists.txt regresses), this step fails
    # here instead of the suite silently disappearing from the matrix.
    - name: Build Windows test targets
      shell: bash
      run: >-
        cmake --build build --config Debug --parallel
        --target env_windows_test leveldb_tests

    # ctest -R selects the standalone env_windows_test ctest entry, which
    # carries all four EnvWindowsTest cases. The FileNameTest/Logging cases
    # live inside the aggregate leveldb_tests binary, which is registered as
    # a single ctest entry, so they are selected with a gtest filter
    # (--gtest_filter) exactly like the `quick` job does. A ctest -R regex
    # cannot reach them; relying on one would silently run nothing.
    - name: Run Windows env suites (env_windows_test)
      shell: bash
      working-directory: ${{ github.workspace }}/build
      run: |
        set -o pipefail
        ctest -C Debug -R '^env_windows_test$' --verbose 2>&1 | tee win_quick_env_ctest.log
        # A filter that silently matches nothing must not pass: the gtest
        # summary has to report every case the suite is supposed to contain.
        passed=$(grep -oE '\[  PASSED  \] [0-9]+ tests?' win_quick_env_ctest.log | grep -oE '[0-9]+' | head -1)
        if [ "${passed:-0}" -lt 4 ]; then
          echo "::error::env_windows_test reported ${passed:-0} passing gtest cases, expected at least 4 (selection went empty or the suite shrank)"
          exit 1
        fi

    - name: Run FileNameTest and Logging
      shell: bash
      working-directory: ${{ github.workspace }}/build
      run: |
        set -o pipefail
        # The Visual Studio generator is multi-config, so the binary lands in
        # build/Debug/ (a single-config generator would put it straight into
        # build/; ctest takes care of the prefix itself through -C Debug).
        ./Debug/leveldb_tests.exe --gtest_filter='FileNameTest.*:Logging.*' 2>&1 | tee win_quick_leveldb_tests.log
        passed=$(grep -oE '\[  PASSED  \] [0-9]+ tests?' win_quick_leveldb_tests.log | grep -oE '[0-9]+' | head -1)
        if [ "${passed:-0}" -lt 7 ]; then
          echo "::error::FileNameTest+Logging reported ${passed:-0} passing gtest cases, expected at least 7 (selection went empty or a case was dropped)"
          exit 1
        fi

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: win-quick-test-logs
        path: |
          build/win_quick_env_ctest.log
          build/win_quick_leveldb_tests.log
          build/Testing/

  # The optional backends (snappy, zstd, google crc32c, tcmalloc) are probes:
  # if a probe fails for any reason the feature silently turns off and every
  # job stays green — which is how the zstd probe (it linked the lowercase
  # `zstd_compress`, but libzstd exports `ZSTD_compress`) went unnoticed. The
  # regular cells install only snappy, so this cell installs all four and:
  #   1. asserts each probe actually came out 1 (INTERNAL cache entry, not
  #      visible via `cmake -L`, hence the direct CMakeCache.txt read);
  #   2. asserts the built test binary is linked against all four libraries;
  #   3. asserts the compression tests RAN (a GTEST_SKIP here is a failure).
  # crc32c is built from source because Ubuntu has no libcrc32c-dev package.
  optional-deps:
    needs: quick
    name: optional-deps (ubuntu gcc ${{ matrix.build_type }}, snappy+zstd+crc32c+tcmalloc)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      # Release exposes different compiler behaviour (NDEBUG disables
      # asserts, -O2 enables inlining, UB can surface only when optimised),
      # so the same assertions run in both configurations.
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install optional dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libsnappy-dev libzstd-dev libgoogle-perftools-dev
        # Ubuntu ships no libcrc32c-dev (only libcrcutil, a different
        # library); build google/crc32c from source at a pinned commit and
        # install it as a shared library so the link probe can see it.
        git clone https://github.com/google/crc32c.git /tmp/crc32c-src
        git -C /tmp/crc32c-src checkout 2bbb3be42e20a0e6c0f7b39dc07dc863d9ffbc07
        cmake -S /tmp/crc32c-src -B /tmp/crc32c-src/build \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
          -DCRC32C_BUILD_TESTS=OFF -DCRC32C_BUILD_BENCHMARKS=OFF \
          -DCRC32C_USE_GLOG=OFF
        cmake --build /tmp/crc32c-src/build --parallel
        sudo cmake --install /tmp/crc32c-src/build
        sudo ldconfig

    - name: Generate build config
      run: >-
        cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build"
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DLEVELDB_BUILD_TESTS=ON
        -DLEVELDB_BUILD_BENCHMARKS=OFF

    - name: Assert every optional backend was detected
      run: |
        fail=0
        for v in HAVE_SNAPPY HAVE_ZSTD HAVE_CRC32C HAVE_TCMALLOC; do
          if ! grep -q "^${v}:INTERNAL=1$" build/CMakeCache.txt; then
            echo "::error::${v} probe failed although the library is installed (silent fallback)"
            fail=1
          fi
        done
        for v in HAVE_SNAPPY HAVE_ZSTD HAVE_CRC32C; do
          if ! grep -q "^#define ${v} 1$" build/include/port/port_config.h; then
            echo "::error::${v} is not 1 in the generated port_config.h"
            fail=1
          fi
        done
        exit $fail

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Assert the test binary links all backends
      run: |
        ldd build/leveldb_tests > build/ldd.log
        cat build/ldd.log
        fail=0
        for lib in libsnappy libzstd libcrc32c libtcmalloc; do
          if ! grep -q "${lib}" build/ldd.log; then
            echo "::error::leveldb_tests is not linked against ${lib}"
            fail=1
          fi
        done
        exit $fail

    # GTEST_SKIP keeps the exit code 0, so a skipped compression case looks
    # like a pass. With all four libraries installed every parameterization
    # must actually execute.
    - name: Compression tests must run, not skip
      run: |
        # GTest names are CompressionTests/CompressionTableTest.<case>/<param>;
        # the pattern must match the whole name, hence the wildcards.
        ./build/leveldb_tests --gtest_filter='*CompressionTableTest*' \
          --gtest_color=no | tee build/compression.log
        if grep -q 'SKIPPED' build/compression.log; then
          echo "::error::a compression test skipped even though the codec is installed"
          exit 1
        fi
        passed=$(grep -oE '\[  PASSED  \] [0-9]+ tests?' build/compression.log | grep -oE '[0-9]+' | head -1)
        if [ "${passed:-0}" -lt 4 ]; then
          echo "::error::expected 4 passing compression tests (2 codecs x 2 cases), got ${passed:-0}"
          exit 1
        fi

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: ctest -C ${{ matrix.build_type }} --verbose

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: optional-deps-logs-${{ matrix.build_type }}
        path: |
          build/compression.log
          build/ldd.log
          build/Testing/

  # Covers the opt-in profile: the library is compiled with
  # -DLEVELDB_DISABLE_EXCEPTIONS=ON (MSVC: /EHs-c- + _HAS_EXCEPTIONS=0,
  # gcc/clang: -fno-exceptions) while the tests still build with exceptions
  # enabled, i.e. the "library without exceptions, consumer with them"
  # combination the option is meant to support. Two cells only: the flag is
  # the same code path on every OS, so ubuntu/gcc plus windows/msvc is enough
  # to keep it from rotting.
  no-exceptions:
    needs: quick
    name: no-exceptions (${{ matrix.os }} ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          compiler: gcc
          CC: gcc
          CXX: g++
        - os: windows-2025
          compiler: msvc
          CC:
          CXX:
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install dependencies on Linux
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt-get update
        sudo apt-get install libkyotocabinet-dev libsnappy-dev libsqlite3-dev

    - name: Generate build config
      run: >-
        cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build"
        -DCMAKE_BUILD_TYPE=Debug
        -DLEVELDB_DISABLE_EXCEPTIONS=ON

    - name: Build
      run: cmake --build "${{ github.workspace }}/build" --config Debug --parallel

    # Guards the kyoto probe against silently skipping the target again: with
    # -fno-exceptions in CMAKE_CXX_FLAGS this check used to fail for the wrong
    # reason and db_bench_tree_db simply disappeared from the build.
    - name: Check the Kyoto Cabinet benchmark was generated
      if: ${{ runner.os == 'Linux' }}
      working-directory: ${{ github.workspace }}/build
      run: test -f db_bench_tree_db

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: ctest -C Debug --verbose

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: no-exceptions-logs-${{ matrix.os }}
        path: build/Testing/

  build-and-test:
    needs: quick
    name:  >-
      CI
      ${{ matrix.os }}
      ${{ matrix.compiler }}
      ${{ matrix.optimized && 'release' || 'debug' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc, msvc]
        # Pinned to the images -latest resolves to today: -latest is a
        # rolling alias (ubuntu is mid-migration to 26) and red must be
        # attributable to our commits, not to a swapped environment.
        os: [ubuntu-24.04, macos-26, windows-2025]
        optimized: [true, false]
        exclude:
        # MSVC only works on Windows.
        - os: ubuntu-24.04
          compiler: msvc
        - os: macos-26
          compiler: msvc
        # Not testing with GCC on macOS.
        - os: macos-26
          compiler: gcc
        # Only testing with MSVC on Windows.
        - os: windows-2025
          compiler: clang
        - os: windows-2025
          compiler: gcc
        include:
        - compiler: clang
          CC: clang
          CXX: clang++
        - compiler: gcc
          CC: gcc
          CXX: g++
        - compiler: msvc
          CC:
          CXX:

    env:
      CMAKE_BUILD_DIR: ${{ github.workspace }}/build
      CMAKE_BUILD_TYPE: ${{ matrix.optimized && 'RelWithDebInfo' || 'Debug' }}
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
      BINARY_SUFFIX: ${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
      BINARY_PATH: >-
        ${{ format(
        startsWith(matrix.os, 'windows') && '{0}\build\{1}\' || '{0}/build/',
        github.workspace,
        matrix.optimized && 'RelWithDebInfo' || 'Debug') }}

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install dependencies on Linux
      if: ${{ runner.os == 'Linux' }}
      # libgoogle-perftools-dev is temporarily removed from the package list
      # because it is currently broken on GitHub's Ubuntu 22.04.
      run: |
        sudo apt-get update
        sudo apt-get install libkyotocabinet-dev libsnappy-dev libsqlite3-dev

    - name: Generate build config
      run: >-
        cmake -S "${{ github.workspace }}" -B "${{ env.CMAKE_BUILD_DIR }}"
        -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
        -DCMAKE_MSVC_RUNTIME_LIBRARY=${{ runner.os == 'Windows' && 'MultiThreaded' || 'MultiThreadedDLL' }}
        -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/install_test/

    - name: Build
      run: >-
        cmake --build "${{ env.CMAKE_BUILD_DIR }}"
        --config "${{ env.CMAKE_BUILD_TYPE }}"

    - name: Run Tests
      working-directory: ${{ github.workspace }}/build
      run: ctest -C "${{ env.CMAKE_BUILD_TYPE }}" --verbose

    - name: Run LevelDB Benchmarks
      run: ${{ env.BINARY_PATH }}db_bench${{ env.BINARY_SUFFIX }}

    - name: Run SQLite Benchmarks
      if: ${{ runner.os != 'Windows' }}
      run: ${{ env.BINARY_PATH }}db_bench_sqlite3${{ env.BINARY_SUFFIX }}

    # The clang-only condition dates from the days when the Kyoto Cabinet
    # probe silently failed under gcc (the global -fno-exceptions poisoned
    # the check), so db_bench_tree_db was never generated there and running
    # it would fail with "file not found". The probe and the benchmark's
    # exception flags are fixed since aa0c122, so gcc links and runs it too;
    # the Linux cells are the ones that install libkyotocabinet-dev.
    - name: Run Kyoto Cabinet Benchmarks
      if: ${{ runner.os == 'Linux' }}
      run: ${{ env.BINARY_PATH }}db_bench_tree_db${{ env.BINARY_SUFFIX }}

    - name: Test CMake installation
      run: cmake --build "${{ env.CMAKE_BUILD_DIR }}" --target install

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ctest-logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.optimized && 'rel' || 'dbg' }}
        path: build/Testing/
